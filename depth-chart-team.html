<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA 2026-27 Depth Chart Editor</title>
<style>
:root{
  --blue:#006BB6;--orange:#F58426;
  --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eef0f2;--bg4:#e2e5e9;
  --border:#d0d7de;--txt:#1a1d23;--txt2:#57606a;--txt3:#8c959f;
  --green:#1a7f37;--yellow:#9a6700;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg2);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;font-size:13px;line-height:1.5}
button,select{font:inherit}
header{background:#003FA5;border-bottom:3px solid var(--orange);padding:14px 24px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header .brand{font-size:20px;font-weight:800;color:#fff}
header .sub{font-size:11px;color:#a8c4e8}
header a.back{margin-left:auto;font-size:11px;color:#ffd29a;text-decoration:none;font-weight:700}
header a.back:hover{text-decoration:underline}
main{max-width:1500px;margin:0 auto;padding:14px 14px 40px}

.controls{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.field{display:grid;gap:4px;color:var(--txt3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.field select{min-width:220px;padding:7px 8px;border:1px solid var(--border);border-radius:4px;background:#fff;font-size:13px;outline:none}
.reset-btn{border:1px solid var(--border);background:#fff;color:var(--txt2);padding:7px 12px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer}
.reset-btn:hover{border-color:var(--orange);color:var(--orange)}
.note{font-size:11px;color:var(--txt3);margin-bottom:12px}

.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.pos-col{background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden;min-height:120px}
.pos-head{background:var(--bg3);border-bottom:1px solid var(--border);padding:8px 11px;font-size:12px;font-weight:800;color:var(--blue);display:flex;justify-content:space-between}
.pos-head span.cnt{color:var(--txt3);font-weight:600;font-size:10px}
.pos-body{padding:7px;min-height:90px;display:flex;flex-direction:column;gap:6px}
.pos-body.drag-over{background:#deeaf8}

.bubble{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:5px 10px 5px 6px;cursor:grab;user-select:none;transition:box-shadow .1s,border-color .1s}
.bubble:hover{border-color:var(--blue);box-shadow:0 1px 3px rgba(0,107,182,.15)}
.bubble.dragging{display:none}
.bubble .slot-num{width:16px;height:16px;border-radius:50%;background:var(--bg4);color:var(--txt2);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bubble .info{flex:1;min-width:0}
.bubble .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble .meta{font-size:10px;color:var(--txt3);display:flex;gap:6px;flex-wrap:wrap}
.bubble .sal{font-family:"SF Mono",Consolas,monospace}
.bubble .tag-pending{color:var(--yellow);font-weight:700}
.placeholder{text-align:center;color:#c8d0d8;font-size:10.5px;font-style:italic;padding:14px 4px;border:1.5px dashed var(--border);border-radius:6px}

.pool-panel{background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.pool-head{background:var(--bg3);border-bottom:1px solid var(--border);padding:8px 11px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2)}
.pool-body{padding:9px;display:flex;flex-wrap:wrap;gap:7px;min-height:56px}
.pool-body.drag-over{background:#deeaf8}
.pool-empty{color:var(--txt3);font-size:11px;font-style:italic;padding:4px}
</style>
</head>
<body>
<header>
  <div class="brand">NBA 2026–27 Depth Chart Editor</div>
  <div class="sub" id="source"></div>
  <a class="back" href="depth-charts.html">← All Teams</a>
</header>
<main>
  <div class="controls">
    <label class="field">Team
      <select id="teamSel" onchange="changeTeam()"></select>
    </label>
    <button class="reset-btn" onclick="resetChart()">Reset to Estimated</button>
  </div>
  <div class="note">Drag players between position columns or reorder within a column to set depth. Session-only for now — reloading the page resets to the cap-hit-ranked estimate.</div>

  <div class="board" id="board"></div>

  <div class="pool-panel">
    <div class="pool-head">Unassigned / Two-Way — drag up into a position</div>
    <div class="pool-body" id="pool" ondragover="colDragOver(event,'POOL')" ondragleave="colDragLeave(event)" ondrop="colDrop(event,'POOL')"></div>
  </div>
</main>

<script src="data/nba_cap_data_2026_27.js"></script>
<script>
const SNAP = window.NBA_CAP_SNAPSHOT;
const POSITIONS = ['PG','SG','SF','PF','C'];
let chart = null;   // {PG:[...],SG:[...],...,POOL:[...]}
let currentAbbr = null;
let dragSrc = null; // {pos, idx}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
}
function fmtSal(v){
  if(v==null) return '—';
  return '$'+(v/1e6).toFixed(1)+'M';
}
function rosterFor(team){
  const rows = [...(team.active_roster||[]), ...(team.pending_transactions||[]).filter(r=>r.category==='pending_transaction')];
  const seen = new Set();
  const out = [];
  for(const r of rows){
    if(seen.has(r.player)) continue;
    seen.add(r.player);
    out.push(r);
  }
  return out;
}
function buildEstimate(abbr){
  const roster = rosterFor(SNAP.teams[abbr]);
  const cols = {PG:[],SG:[],SF:[],PF:[],C:[],POOL:[]};
  for(const p of roster){
    (POSITIONS.includes(p.position) ? cols[p.position] : cols.POOL).push(p);
  }
  for(const k of POSITIONS) cols[k].sort((a,b)=>(b.cap_hit||0)-(a.cap_hit||0));
  cols.POOL.sort((a,b)=>(b.cap_hit||0)-(a.cap_hit||0));
  return cols;
}

function bubbleHtml(p, pos, idx){
  const pending = p.category==='pending_transaction' ? '<span class="tag-pending">PENDING</span>' : '';
  return `
    <div class="bubble" draggable="true" data-pos="${pos}" data-idx="${idx}"
         ondragstart="bubbleDragStart(event,'${pos}',${idx})" ondragend="bubbleDragEnd(event)">
      <div class="slot-num">${idx+1}</div>
      <div class="info">
        <div class="nm">${esc(p.player)}</div>
        <div class="meta"><span class="sal">${fmtSal(p.cap_hit)}</span>${p.age?`<span>${p.age}y</span>`:''}${pending}</div>
      </div>
    </div>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function render(){
  const board = POSITIONS.map(pos=>{
    const players = chart[pos];
    const body = players.length
      ? players.map((p,i)=>bubbleHtml(p,pos,i)).join('')
      : '<div class="placeholder">Drop players here</div>';
    return `
      <div class="pos-col">
        <div class="pos-head">${pos}<span class="cnt">${players.length}</span></div>
        <div class="pos-body" data-pos="${pos}"
             ondragover="colDragOver(event,'${pos}')" ondragleave="colDragLeave(event)" ondrop="colDrop(event,'${pos}')">
          ${body}
        </div>
      </div>`;
  }).join('');
  document.getElementById('board').innerHTML = board;

  const pool = chart.POOL;
  document.getElementById('pool').innerHTML = pool.length
    ? pool.map((p,i)=>bubbleHtml(p,'POOL',i)).join('')
    : '<div class="pool-empty">Nothing unassigned</div>';
}

function bubbleDragStart(e,pos,idx){
  dragSrc = {pos, idx};
  e.dataTransfer.setData('text/plain', JSON.stringify(dragSrc));
  const el = e.target;
  setTimeout(()=>el.classList.add('dragging'), 0);
}
function bubbleDragEnd(e){ e.target.classList.remove('dragging'); }

function colDragOver(e, pos){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function colDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }

function colDrop(e, targetPos){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  let data;
  try{ data = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(_){ return; }
  if(!data) return;
  const {pos:srcPos, idx:srcIdx} = data;
  if(srcPos===undefined || srcIdx===undefined) return;

  const insertIdx = insertionIndex(e.currentTarget, e.clientY);
  const [moved] = chart[srcPos].splice(srcIdx,1);
  if(!moved) return;
  chart[targetPos].splice(insertIdx,0,moved);
  render();
}
function insertionIndex(container, clientY){
  // Exclude the dragged card itself: it hasn't been removed from the DOM yet
  // (only from `chart` once we splice below), so including it would let the
  // midpoint math resolve back to its own slot and produce a silent no-op
  // when reordering within the same column.
  const cards = [...container.querySelectorAll('.bubble:not(.dragging)')];
  for(let i=0;i<cards.length;i++){
    const rect = cards[i].getBoundingClientRect();
    if(clientY <= rect.top + rect.height/2) return i;
  }
  return cards.length;
}

function changeTeam(){
  currentAbbr = document.getElementById('teamSel').value;
  const url = new URL(location.href);
  url.searchParams.set('team', currentAbbr);
  history.replaceState(null,'',url);
  resetChart();
}
function resetChart(){
  chart = buildEstimate(currentAbbr);
  render();
}

function init(){
  document.getElementById('source').textContent = SNAP ? `Data: ${SNAP.season} · fetched ${fmtDate(SNAP.fetched_at)}` : '';
  const abbrs = Object.keys(SNAP.teams).sort((a,b)=>SNAP.teams[a].name.localeCompare(SNAP.teams[b].name));
  const params = new URLSearchParams(location.search);
  const wanted = params.get('team');
  currentAbbr = abbrs.includes(wanted) ? wanted : abbrs[0];
  document.getElementById('teamSel').innerHTML = abbrs.map(a=>
    `<option value="${a}"${a===currentAbbr?' selected':''}>${esc(SNAP.teams[a].name)}</option>`).join('');
  resetChart();
}
init();
</script>
</body>
</html>
