name: Update NBA 3PT Luck Report

on:
  schedule:
    - cron: '0 9 * 10-12,1-6 *'   # 4 AM EST (9 AM UTC) — primary run
    - cron: '0 11 * 10-12,1-6 *'  # 6 AM EST (11 AM UTC) — backup if primary failed
  workflow_dispatch:  # Allow manual trigger
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD). Defaults to yesterday.'
        required: false
        default: ''
      end_date:
        description: 'End date (YYYY-MM-DD). Defaults to start_date.'
        required: false
        default: ''

jobs:
  # Lightweight check: did the primary run already succeed today?
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 20  # Enough history to detect today's auto-update commit

      - name: Check if already updated today
        id: guard
        run: |
          # Manual dispatches always run; only guard scheduled runs
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          YESTERDAY=$(date -u -d '1 day ago' +'%Y-%m-%d')
          TODAY=$(date -u +'%Y-%m-%d')
          # Look for an auto-update commit for yesterday made today by the bot
          if git log --after="${TODAY}T00:00:00Z" --format="%s" | grep -q "Auto-update.*${YESTERDAY}"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already updated for ${YESTERDAY} — backup run not needed."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "No update found for ${YESTERDAY} — proceeding."
          fi

  update-report:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        # Note: lfs disabled - daily updates don't need historical LFS files

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'  # Cache pip dependencies

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Resolve date range
        id: date
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            START="${{ github.event.inputs.start_date }}"
          else
            START=$(date -u -d '1 day ago' +'%Y-%m-%d')
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            END="${{ github.event.inputs.end_date }}"
          else
            END="$START"
          fi
          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT
          echo "yesterday=$(date -u -d '1 day ago' +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "fourteen_days_ago=$(date -u -d '14 days ago' +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Run daily update
        run: |
          python run_daily.py --start ${{ steps.date.outputs.start }} --end ${{ steps.date.outputs.end }}

      - name: Generate report
        run: |
          python generate_report.py

      - name: Pull on/off CSVs from LFS
        run: |
          git lfs install
          git lfs pull --include="data/adjusted_onoff.csv,data/adjusted_onoff_historical_pbp.csv"

      - name: Recompute recent on/off
        continue-on-error: true
        run: |
          python run_onoff.py --start ${{ steps.date.outputs.fourteen_days_ago }} --end ${{ steps.date.outputs.yesterday }} --recompute-existing

      - name: Fetch player boxscores
        continue-on-error: true
        run: |
          python scripts/build_player_boxscore_stats_csv.py

      - name: Update playoff on/off (Apr–Jun only)
        continue-on-error: true
        run: |
          MONTH=$(date -u +'%m')
          if [ "$MONTH" -ge "4" ] && [ "$MONTH" -le "6" ]; then
            python run_onoff.py --playoffs --start ${{ steps.date.outputs.start }} --end ${{ steps.date.outputs.end }}
            python generate_onoff_report_playoffs.py
            python generate_rapm_report_playoffs.py
          fi

      - name: Generate derived reports
        run: |
          python generate_onoff_report.py
          python generate_rapm_report.py --use-possessions
          python generate_onoff_daily_boxscore_report.py
          python fetch_bbref_advanced.py
          python build_65_daily.py
          python generate_playoff_series_report.py

      - name: Copy report to index.html
        run: |
          cp data/3pt_luck_report.html index.html

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update: Games from ${{ steps.date.outputs.start }} to ${{ steps.date.outputs.end }}"
          git push
