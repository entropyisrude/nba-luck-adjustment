<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tonight's Lines Lab — NBA Stats</title>
<style>
  :root{--navy:#12243e;--blue:#2f70c0;--pale:#eef5ff;--ink:#182235;--muted:#60738c;--line:#d6e1ef;--orange:#ef8b2c}
  *{box-sizing:border-box} body{font-family:"Segoe UI",Arial,sans-serif;max-width:1180px;margin:0 auto;padding:20px;background:#f3f7fc;color:var(--ink)}
  .hero{background:linear-gradient(135deg,#10233e,#244e7d);border-radius:16px;padding:22px 26px;color:white;box-shadow:0 9px 24px #17314f26}
  h1{margin:0 0 4px;font-size:1.85rem}.sub{margin:0;color:#d7e8fb;font-size:.92rem}.nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.nav a{color:white;text-decoration:none;border:1px solid #ffffff40;border-radius:7px;padding:5px 9px;font-size:.82rem}.nav a.active{background:#ffffff24}
  .mode{display:inline-flex;align-items:center;gap:6px;background:#ef8b2c;color:#251400;font-weight:800;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:999px;margin-bottom:10px}
  .card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px #17314f12;margin-top:16px;padding:18px}
  .game-head{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.score{font-size:1.55rem;font-weight:800}.score .loser{color:#66778c}.date{color:var(--muted);font-size:.86rem}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.checkpoint,.replay{border:1px solid #b9cce2;background:#f7fbff;color:#284b72;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}.checkpoint.active{background:var(--blue);border-color:var(--blue);color:white}.replay{margin-left:auto;border-color:#efb477;background:#fff7ed;color:#8b4b0b}
  .context{margin-top:12px;background:#f2f7fd;border-left:3px solid var(--blue);padding:9px 11px;color:#536b86;font-size:.83rem;line-height:1.45}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.team h2{margin:0 0 9px;font-size:1rem;display:flex;justify-content:space-between}.team-score{color:var(--blue)}
  .players{display:grid;gap:7px}.player{width:100%;border:1px solid #d8e3f0;background:white;border-radius:10px;padding:10px;text-align:left;cursor:pointer;display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(5,minmax(42px,.55fr));gap:6px;align-items:center}.player:hover{border-color:#70a2dc;background:#f7fbff}.player.selected{border-color:var(--orange);box-shadow:0 0 0 2px #ef8b2c22}.pname{font-weight:750}.stat{text-align:center}.stat b{display:block;font-size:.98rem}.stat small{font-size:.65rem;color:var(--muted)}
  #compare{display:none}.compare-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.compare-head h2{margin:0;font-size:1.18rem}.compare-head p{margin:4px 0 0;color:var(--muted);font-size:.84rem}.loading{color:var(--blue);font-weight:700}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}.metric{border:1px solid var(--line);border-radius:10px;padding:10px;background:#f9fbfe}.metric strong{display:block;font-size:1.25rem;color:#173f6d}.metric span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.8rem;white-space:nowrap}th{background:#edf4fc;color:#45617f;text-align:right;padding:7px;border-bottom:1px solid #cbdbea}th:nth-child(-n+4),td:nth-child(-n+4){text-align:left}td{padding:7px;border-bottom:1px solid #e5edf6;text-align:right}.sim{font-weight:800;color:#2469b6}.query{background:#fff8ed}
  .footnote{font-size:.75rem;color:#667b94;line-height:1.45;margin-top:12px}
  @media(max-width:820px){body{padding:10px}.teams{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.player{grid-template-columns:minmax(105px,1.5fr) repeat(3,1fr)}.player .hide-mobile{display:none}.replay{margin-left:0}}
</style>
</head>
<body>
<div class="hero">
  <div class="mode">Replay prototype</div>
  <h1>Tonight's Lines Lab</h1>
  <p class="sub">See an unusual line develop, then place it against NBA history.</p>
  <div class="nav"><a href="index.html">Home</a><a href="game-similarity.html">Player Game Similarity</a><a class="active" href="live-games.html">Tonight's Lines</a><a href="game-search.html">Game Search</a></div>
</div>

<section class="card">
  <div class="game-head"><div><div class="score" id="score">Loading replay…</div><div class="date" id="game-date"></div></div><div class="date" id="game-id"></div></div>
  <div class="controls" id="controls"></div>
  <div class="context" id="context"></div>
  <div class="teams" id="teams"></div>
</section>

<section class="card" id="compare">
  <div class="compare-head"><div><h2 id="compare-title"></h2><p id="compare-sub"></p></div><div class="loading" id="search-status"></div></div>
  <div class="summary" id="summary"></div>
  <div class="table-wrap"><table><thead><tr><th>#</th><th>Player</th><th>Date</th><th>Opp</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TS%</th><th>Similarity</th></tr></thead><tbody id="matches"></tbody></table></div>
  <div class="footnote" id="compare-note"></div>
</section>

<script>
const VERSION='20260714-live-v1';
const G={name:0,pid:1,date:2,season:3,opp:4,min:5,pts:6,reb:7,ast:8,stl:9,blk:10,tov:11,fga:12,fg3a:13,fg2a:14,fg3_pct:15,fg2_pct:16,fta:17,ft_pct:18,ts:19,pm:20,onoff:21,tpts:22,opts:23,wl:24,gid:25};
const BASE_WEIGHTS={min:.8,pts:1,reb:1,ast:1,stl:1,blk:1,tov:1,fga:1,fg3a:1,fg2a:1,fg3_pct:1,fg2_pct:1,fta:1,ft_pct:1,ts_game:1,plus_minus_actual:0,on_off_actual:0};
let replay,manifest,current=0,selected=null,timer=null;
const shardCache=new Map();

function valid(g,stat){
  const map={ts_game:G.ts,plus_minus_actual:G.pm,on_off_actual:G.onoff}; const idx=map[stat]??G[stat]; const v=g[idx];
  if(v==null||!Number.isFinite(Number(v)))return false;
  if(stat==='fg3_pct')return g[G.fg3a]>0&&v>=0&&v<=1;
  if(stat==='fg2_pct')return g[G.fg2a]>0&&v>=0&&v<=1;
  if(stat==='ft_pct')return g[G.fta]>0&&v>=0&&v<=1;
  if(stat==='ts_game')return g[G.fga]+.44*g[G.fta]>0&&v>=0&&v<=1.5;
  return true;
}
function pct(v){return v==null?'—':(v*100).toFixed(1)+'%'}
function teamFor(g){return g[G.opp]===replay.home.team?replay.away.team:replay.home.team}
function checkpoint(){return replay.checkpoints[current]}

function render(){
  const cp=checkpoint();
  document.getElementById('score').innerHTML=`${replay.away.team} <span class="${cp.away_score<cp.home_score?'loser':''}">${cp.away_score}</span> &nbsp;–&nbsp; ${replay.home.team} <span class="${cp.home_score<cp.away_score?'loser':''}">${cp.home_score}</span>`;
  document.getElementById('game-date').textContent=`${replay.date} · ${cp.label}`;
  document.getElementById('game-id').textContent=`Replay game ${replay.game_id}`;
  document.querySelectorAll('.checkpoint').forEach((b,i)=>b.classList.toggle('active',i===current));
  document.getElementById('context').innerHTML=cp.key==='final'
    ? '<strong>Final line:</strong> comparisons are apples-to-apples against completed historical games.'
    : '<strong>Line so far:</strong> this is provisionally compared with completed historical lines in neighboring playing-time bands. True checkpoint-to-checkpoint history is the next research layer.';
  const groups={[replay.away.team]:[],[replay.home.team]:[]}; cp.players.forEach(g=>groups[teamFor(g)].push(g));
  document.getElementById('teams').innerHTML=[replay.away.team,replay.home.team].map(team=>{
    const score=team===replay.away.team?cp.away_score:cp.home_score;
    const rows=groups[team].sort((a,b)=>b[G.pts]-a[G.pts]).map(g=>`<button class="player" data-pid="${g[G.pid]}"><span class="pname">${g[G.name]}</span><span class="stat"><b>${Math.round(g[G.min])}</b><small>MIN</small></span><span class="stat"><b>${g[G.pts]}</b><small>PTS</small></span><span class="stat"><b>${g[G.reb]}</b><small>REB</small></span><span class="stat hide-mobile"><b>${g[G.ast]}</b><small>AST</small></span><span class="stat hide-mobile"><b>${pct(g[G.ts])}</b><small>TS</small></span></button>`).join('');
    return `<div class="team"><h2>${team}<span class="team-score">${score}</span></h2><div class="players">${rows}</div></div>`;
  }).join('');
  document.querySelectorAll('.player').forEach(btn=>btn.addEventListener('click',()=>comparePlayer(Number(btn.dataset.pid),btn)));
  selected=null; document.getElementById('compare').style.display='none';
}

async function loadShards(minutes){
  const band=manifest.search_shards.findIndex(s=>minutes>=s.min&&minutes<s.max);
  const shards=manifest.search_shards.filter((_,i)=>band<0||Math.abs(i-band)<=1);
  return (await Promise.all(shards.map(async shard=>{
    if(shardCache.has(shard.file))return shardCache.get(shard.file);
    const r=await fetch(`data/game_similarity/search/${shard.file}?v=${VERSION}`); if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const rows=await r.json(); shardCache.set(shard.file,rows); return rows;
  }))).flat();
}

function similarity(query,cand){
  let sum=0,used=0;
  manifest.sim_stats.forEach((stat,i)=>{const w=BASE_WEIGHTS[stat]||0;if(!w||!valid(query,stat)||!valid(cand,stat))return;const qi=(query[G[stat]??({ts_game:G.ts,plus_minus_actual:G.pm,on_off_actual:G.onoff}[stat])]-manifest.means[i])/manifest.stds[i];const ci=(cand[G[stat]??({ts_game:G.ts,plus_minus_actual:G.pm,on_off_actual:G.onoff}[stat])]-manifest.means[i])/manifest.stds[i];sum+=w*(qi-ci)**2;used+=w});
  if(!used)return null;const dist=Math.sqrt(sum/used);return{dist,sim:Math.round(100*Math.exp(-dist*.5))};
}
function percentile(rows,idx,value){if(!rows.length)return 0;return Math.round(100*rows.reduce((n,g)=>n+(g[idx]<=value),0)/rows.length)}
function ordinal(value){const mod100=value%100;if(mod100>=11&&mod100<=13)return value+'th';return value+({1:'st',2:'nd',3:'rd'}[value%10]||'th')}

async function comparePlayer(playerId,button){
  const cp=checkpoint(); const query=cp.players.find(g=>g[G.pid]===playerId); if(!query)return;
  selected=query; document.querySelectorAll('.player').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');
  const panel=document.getElementById('compare');panel.style.display='block';document.getElementById('compare-title').textContent=`${query[G.name]} · ${cp.label}`;
  document.getElementById('compare-sub').textContent=`${Math.round(query[G.min])} MIN · ${query[G.pts]} PTS · ${query[G.reb]} REB · ${query[G.ast]} AST · ${pct(query[G.ts])} TS`;
  if(query[G.min]<5){document.getElementById('search-status').textContent='Historical comparison becomes available after five minutes played.';document.getElementById('summary').innerHTML='';document.getElementById('matches').innerHTML='';document.getElementById('compare-note').textContent='Very short appearances are outside the current historical comparison corpus.';return}
  document.getElementById('search-status').textContent='Searching history…';document.getElementById('summary').innerHTML='';document.getElementById('matches').innerHTML='';
  panel.scrollIntoView({behavior:'smooth',block:'start'});
  try{
    const candidates=await loadShards(query[G.min]);
    const eligible=candidates.filter(g=>g[G.pid]!==query[G.pid]&&g[G.date]<replay.date);
    const ranked=[];eligible.forEach(c=>{const s=similarity(query,c);if(s)ranked.push({c,...s})});ranked.sort((a,b)=>a.dist-b.dist);const top=ranked.slice(0,10);
    const separation=top.length>=10?100-top[9].sim:0;
    document.getElementById('summary').innerHTML=`
      <div class="metric"><strong>${ordinal(percentile(eligible,G.pts,query[G.pts]))}</strong><span>Points percentile</span></div>
      <div class="metric"><strong>${ordinal(percentile(eligible,G.reb,query[G.reb]))}</strong><span>Rebound percentile</span></div>
      <div class="metric"><strong>${ordinal(percentile(eligible,G.ast,query[G.ast]))}</strong><span>Assist percentile</span></div>
      <div class="metric"><strong>${separation}</strong><span>10th-neighbor gap</span></div>`;
    document.getElementById('matches').innerHTML=top.slice(0,5).map((r,i)=>`<tr><td>${i+1}</td><td>${r.c[G.name]}</td><td>${r.c[G.date]}</td><td>${r.c[G.opp]}</td><td>${Math.round(r.c[G.min])}</td><td>${r.c[G.pts]}</td><td>${r.c[G.reb]}</td><td>${r.c[G.ast]}</td><td>${r.c[G.stl]}</td><td>${r.c[G.blk]}</td><td>${pct(r.c[G.ts])}</td><td class="sim">${r.sim}%</td></tr>`).join('');
    document.getElementById('compare-note').textContent=`Compared with ${eligible.length.toLocaleString()} completed player-games in nearby five-minute bands. No era adjustment. “10th-neighbor gap” is 100 minus the similarity of the tenth-closest line; it is an experimental local-separation measure, not a percentile.`;
    document.getElementById('search-status').textContent='';
  }catch(e){document.getElementById('search-status').textContent='Could not load history: '+e.message;}
}

function buildControls(){
  const controls=document.getElementById('controls');
  controls.innerHTML=replay.checkpoints.map((cp,i)=>`<button class="checkpoint" data-i="${i}">${cp.label}</button>`).join('')+'<button class="replay" id="play">▶ Play replay</button>';
  document.querySelectorAll('.checkpoint').forEach(b=>b.addEventListener('click',()=>{current=Number(b.dataset.i);clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ Play replay';render()}));
  document.getElementById('play').addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ Play replay';return}current=0;render();document.getElementById('play').textContent='Ⅱ Pause';timer=setInterval(()=>{if(current>=replay.checkpoints.length-1){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ Play replay';return}current++;render()},2800)});
}

async function init(){
  try{const [r,m]=await Promise.all([fetch(`data/live_replay/42300113.json?v=${VERSION}`),fetch(`data/game_similarity/manifest.json?v=${VERSION}`)]);if(!r.ok||!m.ok)throw new Error('metadata unavailable');[replay,manifest]=await Promise.all([r.json(),m.json()]);buildControls();render()}catch(e){document.getElementById('score').textContent='Could not load replay: '+e.message}
}
init();
</script>
</body>
</html>
