  .hero-nav{display:flex;flex-direction:column;gap:6px;max-width:860px;margin:0 auto}

  /* Autocomplete dropdown */

  /* Weights panel */
  .weights-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 20px}

  .weight-row{display:flex;flex-direction:column;gap:3px}

  .filter-row{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-top:10px;
    font-size:.85em;color:#445}

  .filter-row input[type=number]{width:60px;padding:3px 6px;border:1px solid #c8d8ec;
    border-radius:5px;font-size:.9em}

  /* Results */
  #results-section{display:none}
  .query-header{background:#0d2f53;color:#f0f6ff;padding:12px 16px;border-radius:8px 8px 0 0;
    font-weight:700;font-size:1em}

  table{width:100%;border-collapse:collapse}
  th{background:#152d52;color:#e8f4ff;padding:9px 8px;text-align:left;font-size:.83em;
    font-weight:600;white-space:nowrap}

  .no-oo{color:#ccc;font-size:.75em;font-style:italic}

    background:#f5e8d0;color:#6a3800;margin-left:4px;white-space:nowrap}

  #loading-msg{text-align:center;color:#6680a0;padding:30px}
  .note{font-size:.79em;color:#8898af;margin-top:8px}

<div id="loading-msg">Loading player data…</div>

<div id="app" style="display:none">

  <section>
    <div class="card">
      <div class="search-row">
        <div>
          <label>Player</label>
          <div class="autocomplete-wrap">

            <div id="ac-dropdown"></div>

      <h2 style="margin:14px 0 10px;font-size:.9em;color:#445;font-weight:700;text-transform:uppercase;letter-spacing:.04em">Stat Weights</h2>

<script>
// ─── Data + constants ───────────────────────────────────────────────────────

const STAT_DIMS = [
  { id:'scoring',    label:'Scoring',     stats:['pts','fta','fgp','ftp'],  note:'pts, FTA, FG%, FT%' },
  { id:'playmaking', label:'Playmaking',  stats:['ast','tov'],              note:'ast, tov per 36' },
  { id:'rebounding', label:'Rebounding',  stats:['or','dr'],                note:'oreb, dreb per 36' },
  { id:'defense',    label:'Defense',     stats:['stl','blk'],              note:'stl, blk per 36' },
  { id:'threepoint', label:'3-Point',     stats:['fg3a','fg3p'],            note:'3PA per 36, 3P%' },
  { id:'oooff',      label:'Off. On/Off', stats:['oo_off'],                 note:'off impact, post-1996', optional:true },
  { id:'oodef',      label:'Def. On/Off', stats:['oo_def'],                 note:'def impact, post-1996', optional:true },
];

const COL_FMT = {
  pts:'Pts/36', ast:'Ast/36', or:'ORb/36', dr:'DRb/36',
  stl:'Stl/36', blk:'Blk/36', tov:'Tov/36', fta:'FTA/36',
  fg3a:'3PA/36', fgp:'FG%', fg3p:'3P%', ftp:'FT%',
  oo:'On/Off', oo_off:'Off +/-', oo_def:'Def +/-',
};

const DISPLAY_COLS = ['pts','ast','or','dr','stl','blk','tov','fgp','fg3p','ftp','oo_off','oo_def'];

let allSeasons = [];
let playerIndex = {};   // name → [{season, team, idx}]
let selectedPlayer = null;
let selectedSeason = null;

// ─── Weights UI ─────────────────────────────────────────────────────────────

function buildWeightsUI() {
  const grid = document.getElementById('weights-grid');
  grid.innerHTML = STAT_DIMS.map(d => `
    <div class="weight-row">
      <label>${d.label}${d.optional ? ' <span class="note">(post-96)</span>' : ''}</label>
      <input type="range" id="w-${d.id}" min="0" max="2" step="0.1" value="${(d.id==='oooff'||d.id==='oodef')?0.5:1}">
      <div class="w-val" id="wv-${d.id}">${(d.id==='oooff'||d.id==='oodef')?'0.5':'1.0'}</div>
      <div class="note">${d.note}</div>
    </div>`).join('');
  STAT_DIMS.forEach(d => {
    const inp = document.getElementById('w-' + d.id);
    inp.addEventListener('input', () => {
      document.getElementById('wv-'+d.id).textContent = parseFloat(inp.value).toFixed(1);
    });
  });
}

function getWeights() {
  const w = {};
  STAT_DIMS.forEach(d => {
    const v = parseFloat(document.getElementById('w-' + d.id).value);
    d.stats.forEach(s => w[s] = v);
  });
  return w;
}

// ─── Autocomplete ────────────────────────────────────────────────────────────

function buildPlayerIndex() {
  playerIndex = {};
  allSeasons.forEach((s, i) => {
    const key = s.name.toLowerCase();
    if (!playerIndex[key]) playerIndex[key] = { name: s.name, seasons: [] };
    playerIndex[key].seasons.push({ season: s.season, team: s.team, idx: i });
  });
}

const input = document.getElementById('player-input');
const dropdown = document.getElementById('ac-dropdown');
const seasonSel = document.getElementById('season-select');
const runBtn = document.getElementById('run-btn');

let acActive = -1;

input.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  if (q.length < 2) { dropdown.style.display = 'none'; return; }
  const matches = Object.values(playerIndex)
    .filter(p => p.name.toLowerCase().includes(q))
    .sort((a, b) => {
      const ai = a.name.toLowerCase().indexOf(q);
      const bi = b.name.toLowerCase().indexOf(q);
      return ai - bi || a.name.localeCompare(b.name);
    })
    .slice(0, 20);
  if (!matches.length) { dropdown.style.display = 'none'; return; }
  dropdown.innerHTML = matches.map((p, i) =>
    `<div class="ac-item" data-name="${esc(p.name)}" data-i="${i}">
      ${esc(p.name)}
      <span class="ac-season">${p.seasons[0].season}–${p.seasons[p.seasons.length-1].season}</span>
    </div>`
  ).join('');
  dropdown.style.display = 'block';
  acActive = -1;
  dropdown.querySelectorAll('.ac-item').forEach(el => {
    el.addEventListener('mousedown', e => { e.preventDefault(); selectPlayerName(el.dataset.name); });
  });
});

input.addEventListener('keydown', e => {
  const items = dropdown.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') { acActive = Math.min(acActive+1, items.length-1); highlight(items); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { acActive = Math.max(acActive-1, 0); highlight(items); e.preventDefault(); }
  else if (e.key === 'Enter') {
    if (acActive >= 0) { selectPlayerName(items[acActive].dataset.name); }
    else if (items.length === 1) { selectPlayerName(items[0].dataset.name); }
    e.preventDefault();
  }
  else if (e.key === 'Escape') { dropdown.style.display = 'none'; }
});

document.addEventListener('click', e => { if (!e.target.closest('.autocomplete-wrap')) dropdown.style.display = 'none'; });

function highlight(items) {
  items.forEach((el,i) => el.classList.toggle('selected', i === acActive));
  if (acActive >= 0) items[acActive].scrollIntoView({ block: 'nearest' });
}

function selectPlayerName(name) {
  input.value = name;
  dropdown.style.display = 'none';
  const key = name.toLowerCase();
  const entry = playerIndex[key];
  if (!entry) return;
  selectedPlayer = name;
  const sorted = entry.seasons.sort((a,b) => b.season.localeCompare(a.season));
  seasonSel.innerHTML =
    `<option value="career">Career (all seasons)</option>` +
    sorted.map(s => `<option value="${s.idx}">${s.season}${s.team ? ' · '+s.team : ''}</option>`).join('');
  runBtn.disabled = false;
}

seasonSel.addEventListener('change', () => {
  if (!seasonSel.value) return;
  runBtn.disabled = false;
});


// ─── Career profiles ──────────────────────────────────────────────────────────

const CAREER_COLS = ['pts','ast','or','dr','stl','blk','tov','fta','fg3a','fgp','fg3p','ftp','oo_off','oo_def'];

function buildCareerProfile(seasons) {
  let totalMin = 0, totalGames = 0;
  const sums = {}, wmins = {};
  for (const s of seasons) {
    const m = s.min || 0;
    totalMin += m;
    totalGames += s.games || 0;
    for (const col of CAREER_COLS) {
      if (s[col] != null) {
        sums[col] = (sums[col] || 0) + s[col] * m;
        wmins[col] = (wmins[col] || 0) + m;
      }
    }
  }
  const sortedYears = seasons.map(s => s.season).sort();
  const profile = {
    pid: seasons[0].pid, name: seasons[0].name,
    season: 'Career', team: '',
    seasonStart: sortedYears[0], seasonEnd: sortedYears[sortedYears.length - 1],
    games: totalGames, min: totalMin, age: null,
  };
  for (const col of CAREER_COLS) {
    profile[col] = wmins[col] > 0 ? sums[col] / wmins[col] : null;
  }
  return profile;
}

function buildAllCareerProfiles(minMin) {
  const byPid = {};
  for (const s of allSeasons) {
    if ((s.min || 0) < minMin) continue;
    if (!byPid[s.pid]) byPid[s.pid] = [];
    byPid[s.pid].push(s);
  }
  return Object.values(byPid).map(buildCareerProfile);
}

function midYear(p) {
  if (p.season !== 'Career') return parseInt(p.season);
  return Math.round((parseInt(p.seasonStart) + parseInt(p.seasonEnd)) / 2);
}

// ─── Similarity ──────────────────────────────────────────────────────────────

function computeSimilarity() {
  const val = seasonSel.value;
  const isCareer = val === 'career';
  const queryIdx = isCareer ? -1 : parseInt(val);
  if (!isCareer && isNaN(queryIdx)) return;

  const weights = getWeights();
  const minMin = parseInt(document.getElementById('min-min').value) || 500;
  const exclPlayer = document.getElementById('excl-player').checked;
  const sameEra = document.getElementById('same-era').checked;
  const nResults = parseInt(document.getElementById('n-results').value) || 10;

  let query, pool;

  if (isCareer) {
    const allCareer = buildAllCareerProfiles(minMin);
    const queryPid = allSeasons.find(s => s.name.toLowerCase() === selectedPlayer.toLowerCase())?.pid;
    query = allCareer.find(p => p.pid === queryPid);
    if (!query) return;
    const qMid = midYear(query);
    pool = allCareer.filter(p => {
      if (exclPlayer && p.pid === query.pid) return false;
      if (sameEra && Math.abs(midYear(p) - qMid) > 8) return false;
      return true;
    });
  } else {
    query = allSeasons[queryIdx];
    const queryYear = parseInt(query.season);
    pool = allSeasons.filter((s, i) => {
      if (i === queryIdx) return false;
      if (s.min < minMin) return false;
      if (exclPlayer && s.pid === query.pid) return false;
      if (sameEra && Math.abs(parseInt(s.season) - queryYear) > 8) return false;
      return true;
    });
  }

  // Determine which stats to use (both query and candidate must have value)
  const statCols = Object.keys(weights).filter(s => weights[s] > 0);

  // Compute z-score params across the full qualifying pool + query
  const forNorm = [query, ...pool];
  const means = {}, stds = {};
  statCols.forEach(col => {
    const vals = forNorm.map(s => s[col]).filter(v => v != null);
    if (!vals.length) { means[col] = 0; stds[col] = 1; return; }
    const mean = vals.reduce((a,b) => a+b, 0) / vals.length;
    const std = Math.sqrt(vals.reduce((a,b) => a + (b-mean)**2, 0) / vals.length) || 1;
    means[col] = mean;
    stds[col] = std;
  });

  function zScore(val, col) {
    if (val == null) return null;
    return (val - means[col]) / stds[col];
  }

  const queryZ = {};
  statCols.forEach(col => { queryZ[col] = zScore(query[col], col); });

  // Compute distances
  const scored = pool.map(cand => {
    let sumSq = 0, nUsed = 0;
    statCols.forEach(col => {
      const qz = queryZ[col];
      const cz = zScore(cand[col], col);
      if (qz == null || cz == null) return;
      const w = weights[col];
      sumSq += w * (qz - cz) ** 2;
      nUsed++;
    });
    if (nUsed === 0) return null;
    const dist = Math.sqrt(sumSq / nUsed);
    // Map distance to 0-100 similarity score
    const sim = Math.round(100 * Math.exp(-dist * 0.55));
    return { cand, dist, sim };
  }).filter(Boolean);

  scored.sort((a, b) => a.dist - b.dist);
  return { query, results: scored.slice(0, nResults), statCols };
}

// ─── Render results ──────────────────────────────────────────────────────────

function renderResults() {
  const out = computeSimilarity();
  if (!out) return;
  const { query, results, statCols } = out;

  const section = document.getElementById('results-section');
  section.style.display = 'block';
  section.scrollIntoView({ behavior:'instant', block:'start' });

  const seasonLabel = s => s.season === 'Career'
    ? `Career (${s.seasonStart}–${s.seasonEnd})`
    : s.season + (s.team ? ' · ' + s.team : '');
  document.getElementById('query-header').innerHTML =
    `<span style="font-size:1.05em">${esc(query.name)}</span>` +
    `<span class="qs">${seasonLabel(query)}` +
    ` &nbsp;|&nbsp; ${fmtMin(query.min)} min, ${query.games} G` +
    `${query.age ? ' &nbsp;|&nbsp; Age '+query.age : ''}</span>`;

  const isCareerMode = query.season === 'Career';

  // thead: show the display cols that are in statCols or always-show
  const showCols = DISPLAY_COLS.filter(c => statCols.includes(c) || ['pts','ast','fgp'].includes(c));
  document.getElementById('results-thead').innerHTML = `<tr>
    <th class="rank">#</th>
    <th>Player</th>
    <th>${isCareerMode ? 'Career Span' : 'Season'}</th>
    ${showCols.map(c => `<th>${COL_FMT[c]||c}</th>`).join('')}
    <th>Similarity</th>
  </tr>`;

  // Query row
  let tbody = `<tr style="background:#f0f7ff;font-weight:600">
    <td class="rank" style="color:#3a7bd5">★</td>
    <td>${esc(query.name)}<span class="era-tag modern">Query</span></td>
    <td>${esc(seasonLabel(query))}</td>
    ${showCols.map(c => `<td>${fmtStat(c, query[c])}</td>`).join('')}
    <td>—</td>
  </tr>`;

  tbody += results.map((r, i) => {
    const c = r.cand;
    const isOld = !isCareerMode && parseInt(c.season) < 1996;
    const spanTag = isCareerMode && c.seasonStart
      ? ` <span style="color:#aaa;font-size:.82em">${c.seasonStart}–${c.seasonEnd}</span>` : '';
    return `<tr>
      <td class="rank">${i+1}</td>
      <td>${esc(c.name)}${isOld ? ' <span class="era-tag">pre-96</span>' : ''}</td>
      <td>${isCareerMode
        ? `${c.seasonStart}–${c.seasonEnd}`
        : c.season + (c.team ? ' <span style="color:#aaa;font-size:.82em">'+c.team+'</span>' : '')}</td>
      ${showCols.map(c2 => {
        const val = c[c2];
        const qval = query[c2];
        const diff = (val != null && qval != null) ? val - qval : null;
        const cls = diff == null ? '' : (diff > 0.05 ? ' pos' : diff < -0.05 ? ' neg' : '');
        const diffStr = diff == null ? '' : ` <span class="stat-diff${cls}">${diff>0?'+':''}${fmtDiff(c2,diff)}</span>`;
        return `<td>${fmtStat(c2, val)}${diffStr}</td>`;
      }).join('')}
      <td>
        <div class="sim-bar-wrap">
          <div style="display:flex;align-items:center;gap:5px">
            <div class="sim-bar" style="flex:1"><div class="sim-bar-fill" style="width:${r.sim}%"></div></div>
            <span class="sim-score">${r.sim}</span>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('results-tbody').innerHTML = tbody;

  const ooUsed = statCols.includes('oo_off') || statCols.includes('oo_def');
  const nPre96 = !isCareerMode && results.filter(r => parseInt(r.cand.season) < 1996).length;
  document.getElementById('results-note').textContent =
    isCareerMode
      ? `Career comparison: each entry is a weighted average across all qualifying seasons (≥ min-minutes threshold). Similarity scored 0–100.`
        + (ooUsed ? ' On/off available post-1996 only.' : '')
      : `Similarity scored 0–100 (100 = identical profile). Weighted Euclidean distance on z-normalized per-36 stats.`
        + (ooUsed ? ' On/off splits from pbpstats (post-1996 only) — may skew cross-era comparisons.' : '')
        + (nPre96 ? ` ${nPre96} result(s) are pre-1996 (box stats only, no on/off).` : '');
}

// ─── Formatting ──────────────────────────────────────────────────────────────

function fmtStat(col, val) {
  if (val == null) return '<span class="no-oo">—</span>';
  if (['fgp','fg3p','ftp'].includes(col)) return (val*100).toFixed(1)+'%';
  return val.toFixed(1);
}

function fmtDiff(col, diff) {
  if (diff == null) return '';
  if (['fgp','fg3p','ftp'].includes(col)) return (diff*100).toFixed(1)+'%';
  return Math.abs(diff).toFixed(1);
}

function fmtMin(m) { return m ? m.toLocaleString() : '—'; }

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Init ────────────────────────────────────────────────────────────────────

document.getElementById('run-btn').addEventListener('click', () => {
  try {
    // If no player confirmed yet, try to resolve from whatever is typed
    if (seasonSel.value !== 'career' && isNaN(parseInt(seasonSel.value))) {
      const q = input.value.trim().toLowerCase();
      const matches = q.length >= 2
        ? Object.values(playerIndex).filter(p => p.name.toLowerCase().includes(q))
        : [];
      if (matches.length === 1) {
        selectPlayerName(matches[0].name);
      } else if (matches.length > 1) {
        showError('Multiple players match "' + input.value.trim() + '" — please select one from the dropdown.');
        return;
      } else {
        showError('No player found for "' + input.value.trim() + '" — please select from the dropdown.');
        return;
      }
    }
    renderResults();
  } catch(e) {
    showError('Error: ' + e.message);
    console.error(e);
  }
});

let _errTimer = null;
function showError(msg) {
  let el = document.getElementById('search-error');
  if (!el) {
    el = document.createElement('div');
    el.id = 'search-error';
    el.style.cssText = 'color:#c0392b;font-size:.85em;margin-top:6px;font-weight:600';
    document.querySelector('.search-row').after(el);
  }
  el.textContent = msg;
  if (_errTimer) clearTimeout(_errTimer);
  _errTimer = setTimeout(() => { el.textContent = ''; }, 4000);
}

function clearError() {
  const el = document.getElementById('search-error');
  if (el) el.textContent = '';
}

async function init() {
  try {
    const resp = await fetch('data/player_seasons.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    allSeasons = data.seasons;
    buildPlayerIndex();
    buildWeightsUI();
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('app').style.display = '';
  } catch(e) {
    document.getElementById('loading-msg').textContent = 'Error loading data: ' + e.message;
  }
}

init();
</script>
